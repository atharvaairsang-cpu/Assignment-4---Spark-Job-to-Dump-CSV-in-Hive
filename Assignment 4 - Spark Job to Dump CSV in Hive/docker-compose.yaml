version: '3.8'

services:
  spark-master:
    image: apache/spark:3.5.1
    container_name: spark-master
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master
    ports:
      - "7077:7077"
      - "8080:8080"
    environment:
      - SPARK_MASTER_HOST=spark-master
      - SPARK_MASTER_PORT=7077
      - SPARK_MASTER_WEBUI_PORT=8080
      - SPARK_PUBLIC_DNS=localhost
      - TZ=Asia/Kolkata
    volumes:
      - ./app:/opt/spark-app
      - ./data:/opt/spark-data
      - warehouse:/opt/hive/data/warehouse
      - ./conf/core-site.xml:/opt/spark/conf/core-site.xml
    networks:
      - spark-net

  spark-worker:
    image: apache/spark:3.5.1
    container_name: spark-worker
    depends_on:
      - spark-master
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077
    ports:
      - "8081:8081"
    environment:
      - SPARK_WORKER_CORES=8
      - SPARK_WORKER_MEMORY=8G
      - SPARK_WORKER_WEBUI_PORT=8081
      - SPARK_PUBLIC_DNS=localhost
      - TZ=Asia/Kolkata
    volumes:
      - ./app:/opt/spark-app
      - ./data:/opt/spark-data
      - warehouse:/opt/hive/data/warehouse
      - ./conf/core-site.xml:/opt/spark/conf/core-site.xml
    networks:
      - spark-net

  hive-metastore:
    build: ./hive
    image: local-hive-s3:4.0.0
    container_name: hive-metastore
    user: root
    entrypoint: ["sh", "-c", "chmod -R 777 /opt/hive/data/warehouse /opt/hive/data/metastore-store; exec /entrypoint.sh"]
    env_file:
      - .env
    environment:
      - SERVICE_NAME=metastore
      - TZ=Asia/Kolkata
    ports:
      - "9083:9083"
    volumes:
      - warehouse:/opt/hive/data/warehouse
      - metastore-store:/opt/hive/data/metastore-store
    networks:
      - spark-net

  hive-server:
    build: ./hive
    image: local-hive-s3:4.0.0
    container_name: hive-server
    user: root
    entrypoint: ["sh", "-c", "chmod -R 777 /opt/hive/data/warehouse; exec /entrypoint.sh"]
    depends_on:
      - hive-metastore
    env_file:
      - .env
    environment:
      - SERVICE_NAME=hiveserver2
      - SERVICE_OPTS=-Dhive.metastore.uris=thrift://hive-metastore:9083
      - IS_RESUME=true
      - TZ=Asia/Kolkata
    ports:
      - "10000:10000"
      - "10002:10002"
    volumes:
      - warehouse:/opt/hive/data/warehouse
    networks:
      - spark-net

  jupyter:
    build: .
    image: local-pyspark-351:latest
    container_name: jupyter
    depends_on:
      - spark-master
      - hive-metastore
    env_file:
      - .env
    ports:
      - "8888:8888"
      - "4040:4040"
      - "4041:4041"
      - "4042:4042"
    environment:
      - PYSPARK_MASTER=spark://spark-master:7077
      - PYSPARK_PYTHON=python3
      - SPARK_PUBLIC_DNS=localhost
      - SPARK_UI_PORT=4040
      - TZ=Asia/Kolkata
    volumes:
      - ./notebooks:/opt/spark-notebooks
      - ./data:/opt/spark-data
      - ./app:/opt/spark-app
      - ivy-cache:/home/spark/.ivy2
      - ./conf/hive-site.xml:/opt/spark/conf/hive-site.xml
      - ./conf/core-site.xml:/opt/spark/conf/core-site.xml
      - warehouse:/opt/hive/data/warehouse
    networks:
      - spark-net

networks:
  spark-net:
    driver: bridge

volumes:
  ivy-cache:
  warehouse:
  metastore-store:
